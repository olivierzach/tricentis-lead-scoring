<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Scoring ML System</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1018; color: #eef2f6; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px; background: radial-gradient(circle at 20% 12%, rgba(125, 211, 252, .14), transparent 34%), #0b1018; }
      main { width: min(1080px, 100%); display: grid; gap: 24px; }
      h1 { margin: 0; font-size: clamp(38px, 7vw, 84px); line-height: .96; letter-spacing: 0; }
      p { max-width: 800px; margin: 0; color: #a9b4c0; font-size: 18px; line-height: 1.55; }
      img { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: #fff; }
      .meta { color: #5eead4; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <main>
      <div class="meta">aggregate model diagnostics</div>
      <h1>Lead scoring ML system</h1>
      <p>A static, review-friendly view of model behavior using the aggregate precision-recall tradeoff. No raw accounts, customer records, or private report pages are included.</p>
      <img src="assets/precision-recall-tradeoff.png" alt="Precision-recall threshold tradeoff" />
    </main>
  </body>
</html>
